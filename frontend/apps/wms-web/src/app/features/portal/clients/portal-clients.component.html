<div class="page-enter" *transloco="let t">
  <h1 class="portal-title">{{ t('portal.clients') }}</h1>

  <div class="wms-card">
    <p-table [value]="clients()" [loading]="loading()" [paginator]="true" [rows]="20"
      styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th>{{ t('common.name') }}</th>
          <th>{{ t('common.phone') }}</th>
          <th class="text-right">{{ t('partners.balance') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-c>
        <tr>
          <td>{{ c.name }}</td>
          <td><span class="number">{{ c.phone || '—' }}</span></td>
          <td class="text-right">
            <span class="number" [class.text-danger]="c.debtAmount > 0">{{ c.debtAmount | number: '1.0-2' }}</span>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="3">
            <div class="portal-empty"><i class="pi pi-users"></i><p>{{ t('common.noData') }}</p></div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
