<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('products.units')" [subtitle]="t('products.manageUnits')">
    <p-button icon="pi pi-plus" [label]="t('products.addUnit')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="units()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">{{ t('common.name') }} <p-sortIcon field="name" /></th>
          <th>{{ t('products.shortName') }}</th>
          <th class="text-center">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-unit>
        <tr>
          <td>
            <span class="unit-name">{{ unit.name }}</span>
          </td>
          <td>
            <span class="unit-short number">{{ unit.shortName }}</span>
          </td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(unit)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteUnit(unit)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="3">
            <div class="empty-state">
              <i class="pi pi-ruler-combined"></i>
              <p>{{ t('products.noUnits') }}</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog
    [header]="editing() ? t('common.edit') + ' ' + t('products.units') : t('common.create') + ' ' + t('products.units')"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '400px' }"
    [draggable]="false"
  >
    <div class="form-grid">
      <div class="form-field">
        <label for="unit-name">{{ t('common.name') }} *</label>
        <input id="unit-name" pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" placeholder="e.g. Kilogram" />
      </div>

      <div class="form-field">
        <label for="unit-short">{{ t('products.shortName') }} *</label>
        <input id="unit-short" pInputText [ngModel]="form().shortName" (ngModelChange)="updateForm('shortName', $event)" class="w-full" placeholder="e.g. kg" />
      </div>
    </div>

    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="editing() ? t('common.update') : t('common.create')" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
    </ng-template>
  </p-dialog>
</div>
