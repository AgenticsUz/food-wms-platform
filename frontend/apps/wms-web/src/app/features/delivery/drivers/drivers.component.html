<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('delivery.drivers')" [subtitle]="t('delivery.driversSubtitle')">
    <p-button *hasPermission="'delivery.manage'" icon="pi pi-plus" [label]="t('delivery.newDriver')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table [value]="drivers()" [loading]="loading()" [paginator]="true" [rows]="20" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th>{{ t('delivery.driverName') }}</th>
          <th>{{ t('common.phone') }}</th>
          <th>{{ t('delivery.license') }}</th>
          <th>{{ t('common.status.label') }}</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><span class="item-name">{{ row.fullName }}</span></td>
          <td>{{ row.phone || '—' }}</td>
          <td>{{ row.licenseNumber || '—' }}</td>
          <td>
            <app-status-badge
              [status]="row.isActive ? 'Active' : 'Cancelled'"
              [label]="row.isActive ? t('status.active') : t('status.inactive')"
            />
          </td>
          <td class="text-center actions-cell">
            <p-button *hasPermission="'delivery.manage'" icon="pi pi-telegram" [text]="true" size="small" [title]="t('telegramLink.button')" (onClick)="openTelegram(row)" />
            <p-button *hasPermission="'delivery.manage'" icon="pi pi-pencil" [text]="true" size="small" (onClick)="openEdit(row)" />
            <p-button *hasPermission="'delivery.manage'" icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="remove(row)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state"><i class="pi pi-user"></i><p>{{ t('delivery.noDrivers') }}</p></div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [header]="editingId() !== null ? t('delivery.editDriver') : t('delivery.newDriver')"
    [modal]="true"
    [style]="{ width: '420px' }"
    [draggable]="false"
  >
    <div class="dialog-form">
      <div class="form-field">
        <label for="drvName">{{ t('delivery.driverName') }} *</label>
        <input id="drvName" pInputText [ngModel]="form().fullName" (ngModelChange)="updateForm('fullName', $event)" class="w-full" />
      </div>
      <div class="form-field">
        <label for="drvPhone">{{ t('common.phone') }}</label>
        <input id="drvPhone" pInputText [ngModel]="form().phone" (ngModelChange)="updateForm('phone', $event)" class="w-full" placeholder="+998 90 123 45 67" />
      </div>
      <div class="form-field">
        <label for="drvLicense">{{ t('delivery.license') }}</label>
        <input id="drvLicense" pInputText [ngModel]="form().licenseNumber" (ngModelChange)="updateForm('licenseNumber', $event)" class="w-full" />
      </div>
      <div class="form-field-inline">
        <label for="drvActive">{{ t('status.active') }}</label>
        <p-toggleswitch inputId="drvActive" [ngModel]="form().isActive" (ngModelChange)="updateForm('isActive', $event)" />
      </div>
    </div>
    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="t('common.save')" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
    </ng-template>
  </p-dialog>

  @if (telegramApi(); as api) {
    <app-telegram-link-dialog [(visible)]="telegramVisible" [api]="api" [name]="telegramDriver()?.fullName ?? ''" />
  }
</div>
