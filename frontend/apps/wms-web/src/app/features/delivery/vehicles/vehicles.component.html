<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('delivery.vehicles')" [subtitle]="t('delivery.vehiclesSubtitle')">
    <p-button *hasPermission="'delivery.manage'" icon="pi pi-plus" [label]="t('delivery.newVehicle')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table [value]="vehicles()" [loading]="loading()" [paginator]="true" [rows]="20" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th>{{ t('delivery.vehicleName') }}</th>
          <th>{{ t('delivery.model') }}</th>
          <th class="text-right">{{ t('delivery.capacity') }}</th>
          <th>{{ t('common.status.label') }}</th>
          <th></th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td><span class="item-name">{{ row.name }}</span></td>
          <td>{{ row.model || '—' }}</td>
          <td class="text-right"><span class="number">{{ row.capacity | number: '1.0-2' }}</span></td>
          <td>
            <app-status-badge
              [status]="row.isActive ? 'Active' : 'Cancelled'"
              [label]="row.isActive ? t('status.active') : t('status.inactive')"
            />
          </td>
          <td class="text-center actions-cell">
            <p-button *hasPermission="'delivery.manage'" icon="pi pi-pencil" [text]="true" size="small" (onClick)="openEdit(row)" />
            <p-button *hasPermission="'delivery.manage'" icon="pi pi-trash" [text]="true" severity="danger" size="small" (onClick)="remove(row)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state"><i class="pi pi-truck"></i><p>{{ t('delivery.noVehicles') }}</p></div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog
    [visible]="dialogVisible()"
    (visibleChange)="dialogVisible.set($event)"
    [header]="editingId() !== null ? t('delivery.editVehicle') : t('delivery.newVehicle')"
    [modal]="true"
    [style]="{ width: '420px' }"
    [draggable]="false"
  >
    <div class="dialog-form">
      <div class="form-field">
        <label for="vehName">{{ t('delivery.vehicleName') }} *</label>
        <input id="vehName" pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" placeholder="01 A 123 BC" />
      </div>
      <div class="form-field">
        <label for="vehModel">{{ t('delivery.model') }}</label>
        <input id="vehModel" pInputText [ngModel]="form().model" (ngModelChange)="updateForm('model', $event)" class="w-full" />
      </div>
      <div class="form-field">
        <label for="vehCapacity">{{ t('delivery.capacity') }}</label>
        <p-inputNumber
          inputId="vehCapacity"
          [ngModel]="form().capacity"
          (ngModelChange)="updateForm('capacity', $event ?? 0)"
          [min]="0"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
      </div>
      <div class="form-field-inline">
        <label for="vehActive">{{ t('status.active') }}</label>
        <p-toggleswitch inputId="vehActive" [ngModel]="form().isActive" (ngModelChange)="updateForm('isActive', $event)" />
      </div>
    </div>
    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="t('common.save')" icon="pi pi-check" [loading]="saving()" (onClick)="save()" />
    </ng-template>
  </p-dialog>
</div>
