<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('warehouse.locations')" [subtitle]="t('warehouse.manageBins')">
    <p-button icon="pi pi-plus" [label]="t('warehouse.addLocation')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table [value]="locations()" [loading]="loading()" [paginator]="true" [rows]="20"
      [rowsPerPageOptions]="[10, 20, 50]" [scrollable]="true" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">{{ t('common.name') }} <p-sortIcon field="name" /></th>
          <th>{{ t('common.code') }}</th>
          <th>{{ t('nav.warehouse') }}</th>
          <th class="text-center">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-loc>
        <tr>
          <td><span class="item-name">{{ loc.name }}</span></td>
          <td><span class="code-text">{{ loc.code || '—' }}</span></td>
          <td>{{ loc.warehouseName || '—' }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(loc)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteLocation(loc)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr><td colspan="4"><div class="empty-state"><i class="pi pi-map-marker"></i><p>{{ t('warehouse.noLocations') }}</p></div></td></tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog [header]="editing() ? t('common.edit') + ' ' + t('warehouse.locations') : t('warehouse.addLocation')" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '440px' }" [draggable]="false">
    <div class="form-col">
      <div class="form-field">
        <label for="location-warehouse">{{ t('nav.warehouse') }} *</label>
        <p-select inputId="location-warehouse" [options]="warehouses()" [ngModel]="form().warehouseId" (ngModelChange)="updateForm('warehouseId', $event)"
          optionLabel="name" optionValue="id" [placeholder]="t('transfer.selectWarehouse')" [style]="{ width: '100%' }" />
      </div>
      <div class="form-field">
        <label for="location-name">{{ t('common.name') }} *</label>
        <input id="location-name" pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" placeholder="e.g. Freezer A-1" />
      </div>
      <div class="form-field">
        <label for="location-code">{{ t('common.code') }}</label>
        <input id="location-code" pInputText [ngModel]="form().code ?? ''" (ngModelChange)="updateForm('code', $event || null)" class="w-full" placeholder="e.g. A1" />
      </div>
    </div>
    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="editing() ? t('common.update') : t('common.create')" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
    </ng-template>
  </p-dialog>
</div>
