<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('kpi.shifts')" [subtitle]="t('kpi.manageShifts')">
    <p-button icon="pi pi-plus" [label]="t('kpi.addShift')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="shifts()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">{{ t('common.name') }} <p-sortIcon field="name" /></th>
          <th>{{ t('kpi.startTime') }}</th>
          <th>{{ t('kpi.endTime') }}</th>
          <th class="text-center">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-shift>
        <tr>
          <td>
            <span class="item-name">{{ shift.name }}</span>
          </td>
          <td>
            <span class="time-badge number">{{ shortTime(shift.startTime) }}</span>
          </td>
          <td>
            <span class="time-badge number">{{ shortTime(shift.endTime) }}</span>
          </td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(shift)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteShift(shift)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-clock"></i>
              <p>{{ t('kpi.noShifts') }}</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog
    [header]="editingId() !== null ? t('common.edit') + ' ' + t('kpi.shift') : t('kpi.addShift')"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }"
    [draggable]="false"
  >
    <div class="form-grid">
      <div class="form-field full-width">
        <label for="shiftName">{{ t('common.name') }} *</label>
        <input
          id="shiftName"
          pInputText
          [ngModel]="form().name"
          (ngModelChange)="updateForm('name', $event)"
          class="w-full"
        />
      </div>

      <div class="form-field">
        <label for="shiftStart">{{ t('kpi.startTime') }} *</label>
        <input
          id="shiftStart"
          pInputText
          [ngModel]="form().startTime"
          (ngModelChange)="updateForm('startTime', $event)"
          class="w-full"
          placeholder="HH:mm"
        />
      </div>

      <div class="form-field">
        <label for="shiftEnd">{{ t('kpi.endTime') }} *</label>
        <input
          id="shiftEnd"
          pInputText
          [ngModel]="form().endTime"
          (ngModelChange)="updateForm('endTime', $event)"
          class="w-full"
          placeholder="HH:mm"
        />
      </div>
    </div>

    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button
        [label]="editingId() !== null ? t('common.update') : t('common.create')"
        icon="pi pi-check"
        (onClick)="save()"
        [loading]="saving()"
      />
    </ng-template>
  </p-dialog>
</div>
