<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('kpi.plans')" [subtitle]="t('kpi.enterPlans')">
    <p-button icon="pi pi-plus" [label]="t('kpi.addPlan')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="plans()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="shiftName">{{ t('kpi.shift') }} <p-sortIcon field="shiftName" /></th>
          <th pSortableColumn="productName">{{ t('nav.products') }} <p-sortIcon field="productName" /></th>
          <th class="text-right">{{ t('kpi.planned') }}</th>
          <th pSortableColumn="date">{{ t('common.date') }} <p-sortIcon field="date" /></th>
        </tr>
      </ng-template>
      <ng-template #body let-plan>
        <tr>
          <td>
            <span class="item-name">{{ plan.shiftName }}</span>
          </td>
          <td>{{ plan.productName }}</td>
          <td class="text-right">
            <span class="number">{{ plan.plannedQuantity | number: '1.0-2' }}</span>
          </td>
          <td>{{ plan.date | date: 'mediumDate' }}</td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-calendar"></i>
              <p>{{ t('kpi.noPlans') }}</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

  <p-dialog
    [header]="t('kpi.addPlan')"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '500px' }"
    [draggable]="false"
  >
    <div class="form-grid">
      <div class="form-field">
        <label for="planShift">{{ t('kpi.shift') }} *</label>
        <p-select
          inputId="planShift"
          [options]="shifts()"
          optionLabel="name"
          optionValue="id"
          [ngModel]="form().shiftId"
          (ngModelChange)="updateForm('shiftId', $event)"
          [placeholder]="t('kpi.shift')"
          class="w-full"
        />
      </div>

      <div class="form-field">
        <label for="planProduct">{{ t('nav.products') }} *</label>
        <p-select
          inputId="planProduct"
          [options]="products()"
          optionLabel="name"
          optionValue="id"
          [ngModel]="form().productId"
          (ngModelChange)="updateForm('productId', $event)"
          [placeholder]="t('nav.products')"
          [filter]="true"
          [filterPlaceholder]="t('common.search')"
          class="w-full"
        />
      </div>

      <div class="form-field">
        <label for="planQty">{{ t('kpi.planned') }} *</label>
        <p-inputNumber
          inputId="planQty"
          [ngModel]="form().plannedQuantity"
          (ngModelChange)="updateForm('plannedQuantity', $event)"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          [min]="0"
          placeholder="0"
          class="w-full"
        />
      </div>

      <div class="form-field">
        <label for="planDate">{{ t('common.date') }} *</label>
        <p-datePicker
          inputId="planDate"
          [ngModel]="form().date"
          (ngModelChange)="updateForm('date', $event)"
          dateFormat="yy-mm-dd"
          [placeholder]="t('common.date')"
          class="w-full"
        />
      </div>
    </div>

    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="t('common.create')" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
    </ng-template>
  </p-dialog>
</div>
