<div class="shell" [class.sidebar-collapsed]="sidebarCollapsed()">
  @if (mobileMenuOpen()) {
    <div class="mobile-overlay" (click)="closeMobileMenu()" aria-hidden="true"></div>
  }

  <div class="sidebar-wrapper" [class.mobile-open]="mobileMenuOpen()">
    <app-sidebar (collapseToggled)="onSidebarToggle($event)" />
  </div>

  <div class="main-area">
    <app-header (menuToggled)="toggleMobileMenu()" />
    <app-subscription-banner />
    <main class="content page-enter">
      <router-outlet />
    </main>
  </div>

  @if (aiEnabled()) {
    <button
      type="button"
      class="ai-fab"
      [attr.aria-label]="'AI'"
      (click)="ai.toggle()"
    >
      <i class="pi pi-sparkles" aria-hidden="true"></i>
    </button>

    <app-ai-drawer />
  }
</div>
