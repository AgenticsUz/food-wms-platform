<div class="login-page" *transloco="let t">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-logo"><i class="pi pi-server"></i></div>
      <h1>WMS Platform</h1>
      <p>{{ t('nav.adminConsole') }}</p>
    </div>

    <div class="lang-switch">
      @for (lang of langs; track lang.code) {
        <button type="button" class="lang-btn" [class.active]="activeLang() === lang.code"
                (click)="switchLang(lang.code)">{{ lang.label }}</button>
      }
    </div>

    <form class="login-form" (ngSubmit)="login()">
      <div class="field">
        <label for="phone">{{ t('login.phone') }}</label>
        <p-inputgroup>
          <p-inputgroup-addon>+998</p-inputgroup-addon>
          <input pInputText id="phone" name="phone" autocomplete="username"
                 [ngModel]="phone()" (ngModelChange)="onPhoneInput($event)" placeholder="88 123 45 67" class="w-full" />
        </p-inputgroup>
      </div>
      <div class="field">
        <label for="password">{{ t('login.password') }}</label>
        <p-password id="password" name="password" autocomplete="current-password"
                    [ngModel]="password()" (ngModelChange)="password.set($event)"
                    [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" />
      </div>
      <button type="submit" class="submit-btn" [disabled]="loading()">
        @if (loading()) { <i class="pi pi-spin pi-spinner"></i> } @else { <i class="pi pi-sign-in"></i> }
        <span>{{ t('login.signIn') }}</span>
      </button>
    </form>

    <p class="login-hint">{{ t('login.subtitle') }}</p>
  </div>
</div>
