name: CI

on:
  push:
    branches: [ new-style, main ]
  pull_request:
    branches: [ new-style, main ]

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore wms-api/WMS.sln
      - name: Build (Release)
        run: dotnet build wms-api/WMS.sln --no-restore -c Release --nologo

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wms-ui/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: wms-ui
      - name: Build (production)
        run: npx ng build --configuration production
        working-directory: wms-ui
