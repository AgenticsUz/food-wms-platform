<!-- YANGI: -->
<span class="pill"
      [class.pill-success]="['confirmed','completed','active','ok'].includes(status)"
      [class.pill-warning]="['pending','draft','expiringSoon','lowStock'].includes(status)"
      [class.pill-danger]="['rejected','cancelled','expired'].includes(status)"
      [class.pill-info]="['inProgress','inTransit'].includes(status)"
      [class.pill-neutral]="!['confirmed','completed','active','ok','pending','draft','expiringSoon','lowStock','rejected','cancelled','expired','inProgress','inTransit'].includes(status)">
  {{ label }}
</span>
