<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('settings.profile')" [subtitle]="t('settings.profileInfo')" />

  <!-- Profile Information -->
  <div class="wms-card section-card">
    <h3 class="section-title">{{ t('settings.profileInfo') }}</h3>
    <div class="form-grid">
      <div class="form-field">
        <label>{{ t('settings.fullName') }} *</label>
        <input pInputText [ngModel]="fullName()" (ngModelChange)="fullName.set($event)" class="w-full" placeholder="Your full name" />
      </div>

      <div class="form-field">
        <label>{{ t('common.phone') }} *</label>
        <input pInputText [ngModel]="phone()" (ngModelChange)="phone.set($event)" class="w-full" placeholder="Your phone number" />
      </div>
    </div>
    <div class="form-actions">
      <p-button [label]="t('settings.saveProfile')" icon="pi pi-check" (onClick)="saveProfile()" [loading]="saving()" />
    </div>
  </div>

  <!-- Change Password -->
  <div class="wms-card section-card">
    <h3 class="section-title">{{ t('settings.changePassword') }}</h3>
    <div class="form-col password-form">
      <div class="form-field">
        <label>{{ t('settings.currentPassword') }} *</label>
        <p-password [ngModel]="currentPassword()" (ngModelChange)="currentPassword.set($event)" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Enter current password" />
      </div>

      <div class="form-field">
        <label>{{ t('settings.newPassword') }} *</label>
        <p-password [ngModel]="newPassword()" (ngModelChange)="newPassword.set($event)" [toggleMask]="true" [feedback]="true" styleClass="w-full" inputStyleClass="w-full" placeholder="Enter new password" />
      </div>

      <div class="form-field">
        <label>{{ t('settings.confirmPassword') }} *</label>
        <p-password [ngModel]="confirmPassword()" (ngModelChange)="confirmPassword.set($event)" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Confirm new password" />
      </div>
    </div>
    <div class="form-actions">
      <p-button [label]="t('settings.changePassword')" icon="pi pi-lock" (onClick)="changePassword()" [loading]="changingPassword()" severity="warn" />
    </div>
  </div>
</div>
