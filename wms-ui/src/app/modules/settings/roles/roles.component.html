<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('settings.roles')" [subtitle]="t('settings.manageRoles')">
    <p-button icon="pi pi-plus" [label]="t('settings.addRole')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="roles()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">{{ t('common.name') }} <p-sortIcon field="name" /></th>
          <th>{{ t('common.description') }}</th>
          <th>{{ t('common.date') }}</th>
          <th class="text-center">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-role>
        <tr>
          <td>
            <span class="item-name">{{ role.name }}</span>
          </td>
          <td>
            <span class="text-muted">{{ role.description || '-' }}</span>
          </td>
          <td>{{ role.createdAt | date:'mediumDate' }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(role)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteRole(role)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-shield"></i>
              <p>{{ t('common.noData') }}</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<ng-container *transloco="let t">
  <!-- Role Form Dialog -->
  <p-dialog
    [header]="editing() ? t('common.edit') + ' ' + t('settings.roles') : t('settings.addRole')"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }"
    [draggable]="false"
  >
    <div class="form-col">
      <div class="form-field">
        <label>{{ t('common.name') }} *</label>
        <input pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" placeholder="e.g. Admin" />
      </div>

      <div class="form-field">
        <label>{{ t('common.description') }}</label>
        <textarea pTextarea [ngModel]="form().description" (ngModelChange)="updateForm('description', $event)" class="w-full" [rows]="3" placeholder="Optional description"></textarea>
      </div>
    </div>

    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="editing() ? t('common.update') : t('common.create')" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
    </ng-template>
  </p-dialog>
</ng-container>
