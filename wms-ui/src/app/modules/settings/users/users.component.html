<div class="page-enter">
  <app-page-header title="Users" subtitle="Manage users and role assignments">
    <p-button icon="pi pi-plus" label="Add User" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="users()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="fullName">Full Name <p-sortIcon field="fullName" /></th>
          <th>Phone</th>
          <th class="text-center">Active</th>
          <th>Roles</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-user>
        <tr>
          <td>
            <span class="item-name">{{ user.fullName }}</span>
          </td>
          <td>
            <span class="number">{{ user.phone }}</span>
          </td>
          <td class="text-center">
            <app-status-badge
              [status]="user.isActive ? 'Active' : 'Cancelled'"
              [label]="user.isActive ? 'Active' : 'Inactive'"
            />
          </td>
          <td>
            <span class="roles-text">{{ getRoleNames(user) }}</span>
          </td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-users" [rounded]="true" [text]="true" severity="help" pTooltip="Assign Roles" (onClick)="openRoleDialog(user)" />
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(user)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteUser(user)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-users"></i>
              <p>No users found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- User Form Dialog -->
<p-dialog
  [header]="editing() ? 'Edit User' : 'New User'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '500px' }"
  [draggable]="false"
>
  <div class="form-grid">
    <div class="form-field">
      <label>Full Name *</label>
      <input pInputText [ngModel]="form().fullName" (ngModelChange)="updateForm('fullName', $event)" class="w-full" placeholder="e.g. John Doe" />
    </div>

    <div class="form-field">
      <label>Phone *</label>
      <input pInputText [ngModel]="form().phone" (ngModelChange)="updateForm('phone', $event)" class="w-full" placeholder="e.g. +998901234567" />
    </div>

    @if (!editing()) {
      <div class="form-field full-width">
        <label>Password *</label>
        <p-password [ngModel]="form().password" (ngModelChange)="updateForm('password', $event)" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Enter password" />
      </div>
    }

    <div class="form-field full-width">
      <label>Active</label>
      <p-toggleswitch [ngModel]="form().isActive" (ngModelChange)="updateForm('isActive', $event)" />
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button [label]="editing() ? 'Update' : 'Create'" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>

<!-- Role Assignment Dialog -->
<p-dialog
  header="Assign Roles"
  [(visible)]="roleDialogVisible"
  [modal]="true"
  [style]="{ width: '450px' }"
  [draggable]="false"
>
  <div class="form-col">
    <div class="form-field">
      <label>Select Roles</label>
      <p-multiselect
        [options]="roles()"
        [ngModel]="selectedRoleIds()"
        (ngModelChange)="selectedRoleIds.set($event)"
        optionLabel="name"
        optionValue="id"
        placeholder="Choose roles"
        [showClear]="true"
        styleClass="w-full"
      />
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="roleDialogVisible.set(false)" />
    <p-button label="Save Roles" icon="pi pi-check" (onClick)="saveRoles()" [loading]="saving()" />
  </ng-template>
</p-dialog>
