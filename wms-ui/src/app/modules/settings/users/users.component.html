<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('settings.users')" [subtitle]="t('settings.manageUsers')">
    <p-button icon="pi pi-plus" [label]="t('settings.addUser')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="users()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="fullName">{{ t('settings.fullName') }} <p-sortIcon field="fullName" /></th>
          <th>{{ t('common.phone') }}</th>
          <th class="text-center">{{ t('common.active') }}</th>
          <th>{{ t('settings.roles') }}</th>
          <th class="text-center">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-user>
        <tr>
          <td>
            <span class="item-name">{{ user.fullName }}</span>
          </td>
          <td>
            <span class="number">{{ user.phone }}</span>
          </td>
          <td class="text-center">
            <app-status-badge
              [status]="user.isActive ? 'Active' : 'Cancelled'"
              [label]="user.isActive ? t('common.active') : t('common.inactive')"
            />
          </td>
          <td>
            <span class="roles-text">{{ getRoleNames(user) }}</span>
          </td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-users" [rounded]="true" [text]="true" severity="help" [pTooltip]="t('settings.assignRoles')" (onClick)="openRoleDialog(user)" />
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(user)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteUser(user)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-users"></i>
              <p>{{ t('common.noData') }}</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<ng-container *transloco="let t">
  <!-- User Form Dialog -->
  <p-dialog
    [header]="editing() ? t('common.edit') + ' ' + t('settings.users') : t('settings.addUser')"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '500px' }"
    [draggable]="false"
  >
    <div class="form-grid">
      <div class="form-field">
        <label>{{ t('settings.fullName') }} *</label>
        <input pInputText [ngModel]="form().fullName" (ngModelChange)="updateForm('fullName', $event)" class="w-full" placeholder="e.g. John Doe" />
      </div>

      <div class="form-field">
        <label>{{ t('common.phone') }} *</label>
        <input pInputText [ngModel]="form().phone" (ngModelChange)="updateForm('phone', $event)" class="w-full" placeholder="e.g. +998901234567" />
      </div>

      @if (!editing()) {
        <div class="form-field full-width">
          <label>{{ t('auth.password') }} *</label>
          <p-password [ngModel]="form().password" (ngModelChange)="updateForm('password', $event)" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Enter password" />
        </div>
      }

      <div class="form-field full-width">
        <label>{{ t('common.active') }}</label>
        <p-toggleswitch [ngModel]="form().isActive" (ngModelChange)="updateForm('isActive', $event)" />
      </div>
    </div>

    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="editing() ? t('common.update') : t('common.create')" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
    </ng-template>
  </p-dialog>

  <!-- Role Assignment Dialog -->
  <p-dialog
    [header]="t('settings.assignRoles')"
    [(visible)]="roleDialogVisible"
    [modal]="true"
    [style]="{ width: '450px' }"
    [draggable]="false"
  >
    <div class="form-col">
      <div class="form-field">
        <label>{{ t('settings.assignRoles') }}</label>
        <p-multiselect
          [options]="roles()"
          [ngModel]="selectedRoleIds()"
          (ngModelChange)="selectedRoleIds.set($event)"
          optionLabel="name"
          optionValue="id"
          placeholder="Choose roles"
          [showClear]="true"
          styleClass="w-full"
        />
      </div>
    </div>

    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="roleDialogVisible.set(false)" />
      <p-button [label]="t('common.save')" icon="pi pi-check" (onClick)="saveRoles()" [loading]="saving()" />
    </ng-template>
  </p-dialog>
</ng-container>
