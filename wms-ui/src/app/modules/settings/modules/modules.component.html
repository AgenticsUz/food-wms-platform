<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('settings.modules')" [subtitle]="t('settings.moduleSubtitle')" />

  <div class="wms-card module-list">
    @if (loading()) {
      <div class="loading-state">
        <i class="pi pi-spin pi-spinner"></i>
        <p>{{ t('common.loading') }}</p>
      </div>
    } @else if (modules().length === 0) {
      <div class="empty-state">
        <i class="pi pi-th-large"></i>
        <p>{{ t('common.noData') }}</p>
      </div>
    } @else {
      @for (module of modules(); track module.moduleId) {
        <div class="module-row">
          <div class="module-info">
            <div class="module-name">{{ module.moduleName }}</div>
            <div class="module-code">{{ module.moduleCode }}</div>
          </div>
          <p-toggleswitch
            [ngModel]="module.isEnabled"
            (ngModelChange)="onToggle(module, $event)"
            [disabled]="saving()"
          />
        </div>
      }
    }
  </div>
</div>
