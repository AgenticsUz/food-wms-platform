<div class="page-enter">
  <app-page-header title="Units" subtitle="Manage measurement units">
    <p-button icon="pi pi-plus" label="Add Unit" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="units()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Short Name</th>
          <th>Created</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-unit>
        <tr>
          <td>
            <span class="unit-name">{{ unit.name }}</span>
          </td>
          <td>
            <span class="unit-short number">{{ unit.shortName }}</span>
          </td>
          <td>{{ unit.createdAt }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(unit)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteUnit(unit)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-ruler-combined"></i>
              <p>No units found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Unit Form Dialog -->
<p-dialog
  [header]="editing() ? 'Edit Unit' : 'New Unit'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '400px' }"
  [draggable]="false"
>
  <div class="form-grid">
    <div class="form-field">
      <label>Name *</label>
      <input pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" placeholder="e.g. Kilogram" />
    </div>

    <div class="form-field">
      <label>Short Name *</label>
      <input pInputText [ngModel]="form().shortName" (ngModelChange)="updateForm('shortName', $event)" class="w-full" placeholder="e.g. kg" />
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button [label]="editing() ? 'Update' : 'Create'" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
