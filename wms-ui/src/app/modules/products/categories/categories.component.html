<div class="page-enter">
  <app-page-header title="Categories" subtitle="Organize products into categories">
    <p-button icon="pi pi-plus" label="Add Category" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="flatCategories()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Parent</th>
          <th>Created</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-cat>
        <tr>
          <td>
            <span class="category-name">{{ cat.name }}</span>
          </td>
          <td>{{ cat.parentId ? 'Sub-category' : 'Root' }}</td>
          <td>{{ cat.createdAt }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(cat)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteCategory(cat)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="4">
            <div class="empty-state">
              <i class="pi pi-folder-open"></i>
              <p>No categories found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Category Form Dialog -->
<p-dialog
  [header]="editing() ? 'Edit Category' : 'New Category'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '420px' }"
  [draggable]="false"
>
  <div class="form-grid">
    <div class="form-field">
      <label>Name *</label>
      <input pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" />
    </div>

    <div class="form-field">
      <label>Parent Category</label>
      <p-select
        [options]="parentOptions()"
        [ngModel]="form().parentId"
        (ngModelChange)="updateForm('parentId', $event)"
        optionLabel="label"
        optionValue="value"
        placeholder="None (root)"
        [showClear]="true"
        [style]="{ width: '100%' }" />
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button [label]="editing() ? 'Update' : 'Create'" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
