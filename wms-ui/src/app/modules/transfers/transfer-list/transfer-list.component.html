<div class="page-enter">
  <app-page-header title="Transfers" subtitle="Manage incoming, outgoing and internal transfers">
    <p-button icon="pi pi-plus" label="New Transfer" (onClick)="createNew()" />
  </app-page-header>

  <div class="filters-bar wms-card">
    <div class="filter-group">
      <p-select [options]="typeOptions" [ngModel]="typeFilter()" (ngModelChange)="typeFilter.set($event); onFilterChange()"
        optionLabel="label" optionValue="value" placeholder="Type" [style]="{ minWidth: '160px' }" />
    </div>
    <div class="filter-group">
      <p-select [options]="statusOptions" [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event); onFilterChange()"
        optionLabel="label" optionValue="value" placeholder="Status" [style]="{ minWidth: '160px' }" />
    </div>
    <div class="filter-group">
      <p-datepicker [ngModel]="dateFrom()" (ngModelChange)="dateFrom.set($event); onFilterChange()" dateFormat="yy-mm-dd" [showIcon]="true" placeholder="From" />
    </div>
    <div class="filter-group">
      <p-datepicker [ngModel]="dateTo()" (ngModelChange)="dateTo.set($event); onFilterChange()" dateFormat="yy-mm-dd" [showIcon]="true" placeholder="To" />
    </div>
  </div>

  <div class="wms-card table-wrapper">
    <p-table [value]="transfers()" [loading]="loading()" [paginator]="true" [rows]="15"
      [rowsPerPageOptions]="[10, 15, 25, 50]" [scrollable]="true" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th>ID</th>
          <th>Type</th>
          <th>Counterparty / Warehouse</th>
          <th class="text-right">Amount</th>
          <th>Status</th>
          <th pSortableColumn="createdAt">Date <p-sortIcon field="createdAt" /></th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-t>
        <tr>
          <td><span class="number">#{{ t.id }}</span></td>
          <td><span class="type-label">{{ getTypeName(t.type) }}</span></td>
          <td>{{ t.counterpartyName || t.fromWarehouseName || t.toWarehouseName || '—' }}</td>
          <td class="text-right"><span class="number">{{ t.totalAmount | number:'1.0-2' }}</span></td>
          <td>
            <app-status-badge [status]="getStatusKey(t.status)" [label]="getStatusName(t.status)" />
          </td>
          <td>{{ t.createdAt | date:'MMM d, yyyy HH:mm' }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-eye" [rounded]="true" [text]="true" severity="secondary" (onClick)="viewDetail(t)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr><td colspan="7"><div class="empty-state"><i class="pi pi-arrow-right-arrow-left"></i><p>No transfers found</p></div></td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
