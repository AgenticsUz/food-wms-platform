<div class="login-page" *transloco="let t">
  <div class="login-card">
    <!-- Logo / Brand -->
    <div class="login-header">
      <div class="logo-circle">
        <i class="pi pi-warehouse"></i>
      </div>
      <h1 class="login-title">{{ t('auth.loginTitle') }}</h1>
      <p class="login-subtitle">{{ t('auth.loginSubtitle') }}</p>
    </div>

    <!-- Form -->
    <form class="login-form" (ngSubmit)="login()">
      <div class="field">
        <label for="phone">{{ t('auth.phone') }}</label>
        <p-inputgroup>
          <p-inputgroup-addon>+998</p-inputgroup-addon>
          <input pInputText
                 id="phone"
                 [ngModel]="phone()"
                 (ngModelChange)="onPhoneInput($event)"
                 name="phone"
                 placeholder="88 123 45 67"
                 maxlength="9"
                 class="w-full" />
        </p-inputgroup>
      </div>

      <div class="field">
        <label for="password">{{ t('auth.password') }}</label>
        <p-password id="password"
                    [ngModel]="password()"
                    (ngModelChange)="password.set($event)"
                    name="password"
                    [toggleMask]="true"
                    [feedback]="false"
                    styleClass="w-full"
                    inputStyleClass="w-full" />
      </div>

      <p-button type="submit"
                [label]="t('auth.signIn')"
                icon="pi pi-sign-in"
                styleClass="w-full"
                [loading]="loading()" />
    </form>
  </div>
</div>
