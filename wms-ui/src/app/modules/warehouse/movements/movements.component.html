<div class="page-enter">
  <app-page-header title="Stock Movements" subtitle="Track warehouse stock changes" />

  <div class="filters-bar wms-card">
    <div class="filter-group">
      <label class="filter-label">From:</label>
      <p-datepicker [ngModel]="dateFrom()" (ngModelChange)="dateFrom.set($event); onDateChange()" dateFormat="yy-mm-dd" [showIcon]="true" placeholder="Start date" />
    </div>
    <div class="filter-group">
      <label class="filter-label">To:</label>
      <p-datepicker [ngModel]="dateTo()" (ngModelChange)="dateTo.set($event); onDateChange()" dateFormat="yy-mm-dd" [showIcon]="true" placeholder="End date" />
    </div>
  </div>

  <div class="wms-card table-wrapper">
    <p-table [value]="movements()" [loading]="loading()" [paginator]="true" [rows]="20"
      [rowsPerPageOptions]="[10, 20, 50]" [scrollable]="true" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="productName">Product <p-sortIcon field="productName" /></th>
          <th>Warehouse</th>
          <th>Type</th>
          <th class="text-right">Quantity</th>
          <th>Unit</th>
          <th pSortableColumn="date">Date <p-sortIcon field="date" /></th>
          <th>Note</th>
        </tr>
      </ng-template>
      <ng-template #body let-m>
        <tr>
          <td><span class="item-name">{{ m.productName }}</span></td>
          <td>{{ m.warehouseName }}</td>
          <td>
            <app-status-badge [status]="getMovementStatus(m.type)" [label]="m.type" />
          </td>
          <td class="text-right"><span class="number">{{ m.quantity | number:'1.0-2' }}</span></td>
          <td>{{ m.unitShortName }}</td>
          <td>{{ m.date | date:'MMM d, yyyy' }}</td>
          <td>{{ m.note || '—' }}</td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr><td colspan="7"><div class="empty-state"><i class="pi pi-arrow-right-arrow-left"></i><p>No movements found</p></div></td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
