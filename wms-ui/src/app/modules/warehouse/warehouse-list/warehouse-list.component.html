<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('warehouse.warehouses')" [subtitle]="t('warehouse.manageWarehouses')">
    <p-button icon="pi pi-plus" [label]="t('warehouse.addWarehouse')" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table [value]="warehouses()" [loading]="loading()" [paginator]="true" [rows]="20"
      [scrollable]="true" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">{{ t('common.name') }} <p-sortIcon field="name" /></th>
          <th>{{ t('common.type') }}</th>
          <th>{{ t('common.description') }}</th>
          <th class="text-center">{{ t('common.actions') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-w>
        <tr>
          <td><span class="item-name">{{ w.name }}</span></td>
          <td><app-status-badge [status]="getTypeStatus(w.type)" [label]="getTypeName(w.type)" /></td>
          <td>{{ w.description || '—' }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(w)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr><td colspan="4"><div class="empty-state"><i class="pi pi-building"></i><p>{{ t('common.noData') }}</p></div></td></tr>
      </ng-template>
    </p-table>
  </div>
</div>

<ng-container *transloco="let t">
  <p-dialog [header]="editing() ? t('common.edit') + ' ' + t('nav.warehouse') : t('warehouse.addWarehouse')" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '460px' }" [draggable]="false">
    <div class="form-col">
      <div class="form-field">
        <label>{{ t('common.name') }} *</label>
        <input pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" />
      </div>
      <div class="form-field">
        <label>{{ t('common.type') }} *</label>
        <p-select [options]="typeOptions" [ngModel]="form().type" (ngModelChange)="updateForm('type', $event)"
          optionLabel="label" optionValue="value" [style]="{ width: '100%' }" />
      </div>
      <div class="form-field">
        <label>{{ t('common.description') }}</label>
        <textarea pTextarea [ngModel]="form().description ?? ''" (ngModelChange)="updateForm('description', $event || null)" class="w-full" rows="3"></textarea>
      </div>
    </div>
    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="editing() ? t('common.update') : t('common.create')" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
    </ng-template>
  </p-dialog>
</ng-container>
