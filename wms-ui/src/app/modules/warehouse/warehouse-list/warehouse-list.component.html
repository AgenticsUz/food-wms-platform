<div class="page-enter">
  <app-page-header title="Warehouses" subtitle="Manage your warehouse facilities">
    <p-button icon="pi pi-plus" label="Add Warehouse" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table [value]="warehouses()" [loading]="loading()" [paginator]="true" [rows]="20"
      [scrollable]="true" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Type</th>
          <th>Description</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-w>
        <tr>
          <td><span class="item-name">{{ w.name }}</span></td>
          <td><app-status-badge [status]="getTypeStatus(w.type)" [label]="getTypeName(w.type)" /></td>
          <td>{{ w.description || '—' }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(w)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr><td colspan="4"><div class="empty-state"><i class="pi pi-building"></i><p>No warehouses found</p></div></td></tr>
      </ng-template>
    </p-table>
  </div>
</div>

<p-dialog [header]="editing() ? 'Edit Warehouse' : 'New Warehouse'" [(visible)]="dialogVisible" [modal]="true" [style]="{ width: '460px' }" [draggable]="false">
  <div class="form-col">
    <div class="form-field">
      <label>Name *</label>
      <input pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" />
    </div>
    <div class="form-field">
      <label>Type *</label>
      <p-select [options]="typeOptions" [ngModel]="form().type" (ngModelChange)="updateForm('type', $event)"
        optionLabel="label" optionValue="value" [style]="{ width: '100%' }" />
    </div>
    <div class="form-field">
      <label>Description</label>
      <textarea pTextarea [ngModel]="form().description ?? ''" (ngModelChange)="updateForm('description', $event || null)" class="w-full" rows="3"></textarea>
    </div>
  </div>
  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button [label]="editing() ? 'Update' : 'Create'" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
