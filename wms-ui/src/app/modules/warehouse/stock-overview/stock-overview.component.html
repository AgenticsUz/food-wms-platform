<div class="page-enter">
  <app-page-header title="Stock Overview" subtitle="Current warehouse inventory" />

  <div class="filters-bar wms-card">
    <div class="filter-group">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input pInputText placeholder="Search by product or lot..." [ngModel]="search()" (ngModelChange)="onSearch($event)" />
      </span>
    </div>
    <div class="filter-group">
      <p-select
        [options]="warehouseOptions()"
        [ngModel]="selectedWarehouseId()"
        (ngModelChange)="onWarehouseChange($event)"
        optionLabel="label"
        optionValue="value"
        placeholder="Select warehouse"
        [style]="{ minWidth: '200px' }" />
    </div>
  </div>

  <div class="wms-card table-wrapper">
    <p-table [value]="filtered()" [loading]="loading()" [paginator]="true" [rows]="20"
      [rowsPerPageOptions]="[10, 20, 50]" [scrollable]="true" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="productName">Product <p-sortIcon field="productName" /></th>
          <th>Lot Number</th>
          <th>Warehouse</th>
          <th>Location</th>
          <th class="text-right" pSortableColumn="quantity">Quantity <p-sortIcon field="quantity" /></th>
          <th>Unit</th>
          <th>Expiry</th>
          <th>Status</th>
        </tr>
      </ng-template>
      <ng-template #body let-s>
        <tr [class.row-alert]="isLow(s)">
          <td><span class="item-name">{{ s.productName }}</span></td>
          <td><span class="lot-number">{{ s.lotNumber }}</span></td>
          <td>{{ s.warehouseName }}</td>
          <td>{{ s.locationName }}</td>
          <td class="text-right"><span class="number">{{ s.quantity | number:'1.0-2' }}</span></td>
          <td>{{ s.unitShortName }}</td>
          <td>
            @if (s.expiryDate) {
              {{ s.expiryDate | date:'MMM d, yyyy' }}
            } @else { — }
          </td>
          <td>
            <app-status-badge [status]="getExpiryStatus(s.expiryDate)" [label]="getExpiryLabel(s.expiryDate)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr><td colspan="8"><div class="empty-state"><i class="pi pi-box"></i><p>No stock data</p></div></td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
