<div class="page-enter">
  <app-page-header title="Shifts" subtitle="Manage work shifts">
    <p-button icon="pi pi-plus" label="Add Shift" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="shifts()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Created</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-shift>
        <tr>
          <td>
            <span class="item-name">{{ shift.name }}</span>
          </td>
          <td>
            <span class="time-badge number">{{ shift.startTime }}</span>
          </td>
          <td>
            <span class="time-badge number">{{ shift.endTime }}</span>
          </td>
          <td>{{ shift.createdAt }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="info" (onClick)="openEdit(shift)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteShift(shift)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-clock"></i>
              <p>No shifts found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Shift Form Dialog -->
<p-dialog
  [header]="editing() ? 'Edit Shift' : 'New Shift'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '450px' }"
  [draggable]="false"
>
  <div class="form-grid">
    <div class="form-field full-width">
      <label>Name *</label>
      <input pInputText [ngModel]="form().name" (ngModelChange)="updateForm('name', $event)" class="w-full" placeholder="e.g. Morning" />
    </div>

    <div class="form-field">
      <label>Start Time *</label>
      <input pInputText [ngModel]="form().startTime" (ngModelChange)="updateForm('startTime', $event)" class="w-full" placeholder="HH:mm" />
    </div>

    <div class="form-field">
      <label>End Time *</label>
      <input pInputText [ngModel]="form().endTime" (ngModelChange)="updateForm('endTime', $event)" class="w-full" placeholder="HH:mm" />
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button [label]="editing() ? 'Update' : 'Create'" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
