<div class="page-enter">
  <app-page-header title="Shift Plans" subtitle="Plan production targets per shift">
    <p-button icon="pi pi-plus" label="Add Plan" (onClick)="openNew()" />
  </app-page-header>

  <div class="wms-card table-wrapper">
    <p-table
      [value]="plans()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="20"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="shiftName">Shift <p-sortIcon field="shiftName" /></th>
          <th pSortableColumn="productName">Product <p-sortIcon field="productName" /></th>
          <th class="text-right">Planned Qty</th>
          <th pSortableColumn="date">Date <p-sortIcon field="date" /></th>
          <th>Created</th>
        </tr>
      </ng-template>
      <ng-template #body let-plan>
        <tr>
          <td>
            <span class="item-name">{{ plan.shiftName }}</span>
          </td>
          <td>{{ plan.productName }}</td>
          <td class="text-right">
            <span class="number">{{ plan.plannedQuantity | number:'1.0-2' }}</span>
          </td>
          <td>{{ plan.date | date:'mediumDate' }}</td>
          <td>{{ plan.createdAt | date:'mediumDate' }}</td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-calendar"></i>
              <p>No shift plans found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Plan Form Dialog -->
<p-dialog
  header="New Shift Plan"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '500px' }"
  [draggable]="false"
>
  <div class="form-grid">
    <div class="form-field">
      <label>Shift *</label>
      <p-select
        [options]="shifts()"
        optionLabel="name"
        optionValue="id"
        [ngModel]="form().shiftId"
        (ngModelChange)="updateForm('shiftId', $event)"
        placeholder="Select shift"
        class="w-full"
      />
    </div>

    <div class="form-field">
      <label>Product *</label>
      <p-select
        [options]="products()"
        optionLabel="name"
        optionValue="id"
        [ngModel]="form().productId"
        (ngModelChange)="updateForm('productId', $event)"
        placeholder="Select product"
        [filter]="true"
        filterPlaceholder="Search..."
        class="w-full"
      />
    </div>

    <div class="form-field">
      <label>Planned Quantity *</label>
      <p-inputNumber
        [ngModel]="form().plannedQuantity"
        (ngModelChange)="updateForm('plannedQuantity', $event)"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        [min]="0"
        placeholder="0"
        class="w-full"
      />
    </div>

    <div class="form-field">
      <label>Date *</label>
      <p-datePicker
        [ngModel]="form().date"
        (ngModelChange)="updateForm('date', $event)"
        dateFormat="yy-mm-dd"
        placeholder="Select date"
        class="w-full"
      />
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button label="Create" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
