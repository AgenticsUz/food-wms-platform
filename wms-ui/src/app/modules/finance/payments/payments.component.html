<div class="page-enter" *transloco="let t">
  <app-page-header [title]="t('finance.payments')" [subtitle]="t('finance.payment')">
    <p-button icon="pi pi-plus" [label]="t('finance.recordPayment')" (onClick)="openNew()" />
  </app-page-header>

  <!-- Payments Table -->
  <div class="wms-card table-wrapper">
    <p-table
      [value]="payments()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="15"
      [rowsPerPageOptions]="[10, 15, 25, 50]"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="counterpartyName">{{ t('finance.counterparty') }} <p-sortIcon field="counterpartyName" /></th>
          <th class="text-right" pSortableColumn="amount">{{ t('common.amount') }} <p-sortIcon field="amount" /></th>
          <th>{{ t('finance.paymentMethod') }}</th>
          <th pSortableColumn="paidAt">{{ t('common.date') }} <p-sortIcon field="paidAt" /></th>
          <th>{{ t('common.note') }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-p>
        <tr>
          <td>
            <span class="item-name">{{ p.counterpartyName }}</span>
          </td>
          <td class="text-right">
            <span class="number payment-amount">{{ p.amount | number:'1.0-2' }}</span>
          </td>
          <td>
            <app-status-badge [status]="getMethodStatus(p.method)" [label]="getMethodName(p.method)" />
          </td>
          <td>{{ p.paidAt | date:'MMM d, yyyy HH:mm' }}</td>
          <td>{{ p.note || '—' }}</td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-wallet"></i>
              <p>{{ t('finance.noPayments') }}</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Record Payment Dialog -->
<ng-container *transloco="let t">
  <p-dialog
    [header]="t('finance.recordPayment')"
    [(visible)]="dialogVisible"
    [modal]="true"
    [style]="{ width: '480px' }"
    [draggable]="false">
    <div class="form-grid">
      <div class="form-field full-width">
        <label>{{ t('finance.counterparty') }} *</label>
        <p-select
          [options]="counterparties()"
          [ngModel]="form().counterpartyId"
          (ngModelChange)="updateForm('counterpartyId', $event)"
          optionLabel="name"
          optionValue="id"
          placeholder="Select counterparty"
          [filter]="true"
          filterBy="name"
          [style]="{ width: '100%' }" />
      </div>

      <div class="form-field">
        <label>{{ t('common.amount') }} *</label>
        <p-inputNumber
          [ngModel]="form().amount"
          (ngModelChange)="updateForm('amount', $event)"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          mode="decimal"
          [style]="{ width: '100%' }" />
      </div>

      <div class="form-field">
        <label>{{ t('finance.paymentMethod') }} *</label>
        <p-select
          [options]="methodOptions()"
          [ngModel]="form().method"
          (ngModelChange)="updateForm('method', $event)"
          optionLabel="label"
          optionValue="value"
          [style]="{ width: '100%' }" />
      </div>

      <div class="form-field full-width">
        <label>{{ t('common.note') }}</label>
        <textarea pTextarea
          [ngModel]="form().note ?? ''"
          (ngModelChange)="updateForm('note', $event || null)"
          rows="3"
          class="w-full"
          placeholder="Optional note..."></textarea>
      </div>
    </div>

    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="t('common.save')" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
    </ng-template>
  </p-dialog>
</ng-container>
