<div class="page-enter">
  <app-page-header title="Payments" subtitle="Record and track payment history">
    <p-button icon="pi pi-plus" label="Record Payment" (onClick)="openNew()" />
  </app-page-header>

  <!-- Payments Table -->
  <div class="wms-card table-wrapper">
    <p-table
      [value]="payments()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="15"
      [rowsPerPageOptions]="[10, 15, 25, 50]"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="counterpartyName">Counterparty <p-sortIcon field="counterpartyName" /></th>
          <th class="text-right" pSortableColumn="amount">Amount <p-sortIcon field="amount" /></th>
          <th>Method</th>
          <th pSortableColumn="paidAt">Date <p-sortIcon field="paidAt" /></th>
          <th>Note</th>
        </tr>
      </ng-template>
      <ng-template #body let-p>
        <tr>
          <td>
            <span class="item-name">{{ p.counterpartyName }}</span>
          </td>
          <td class="text-right">
            <span class="number payment-amount">{{ p.amount | number:'1.0-2' }}</span>
          </td>
          <td>
            <app-status-badge [status]="getMethodStatus(p.method)" [label]="getMethodName(p.method)" />
          </td>
          <td>{{ p.paidAt | date:'MMM d, yyyy HH:mm' }}</td>
          <td>{{ p.note || '—' }}</td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="5">
            <div class="empty-state">
              <i class="pi pi-wallet"></i>
              <p>No payments recorded</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Record Payment Dialog -->
<p-dialog
  header="Record Payment"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '480px' }"
  [draggable]="false">
  <div class="form-grid">
    <div class="form-field full-width">
      <label>Counterparty *</label>
      <p-select
        [options]="counterparties()"
        [ngModel]="form().counterpartyId"
        (ngModelChange)="updateForm('counterpartyId', $event)"
        optionLabel="name"
        optionValue="id"
        placeholder="Select counterparty"
        [filter]="true"
        filterBy="name"
        [style]="{ width: '100%' }" />
    </div>

    <div class="form-field">
      <label>Amount *</label>
      <p-inputNumber
        [ngModel]="form().amount"
        (ngModelChange)="updateForm('amount', $event)"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        mode="decimal"
        [style]="{ width: '100%' }" />
    </div>

    <div class="form-field">
      <label>Method *</label>
      <p-select
        [options]="methodOptions"
        [ngModel]="form().method"
        (ngModelChange)="updateForm('method', $event)"
        optionLabel="label"
        optionValue="value"
        [style]="{ width: '100%' }" />
    </div>

    <div class="form-field full-width">
      <label>Note</label>
      <textarea pTextarea
        [ngModel]="form().note ?? ''"
        (ngModelChange)="updateForm('note', $event || null)"
        rows="3"
        class="w-full"
        placeholder="Optional note..."></textarea>
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button label="Record" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
