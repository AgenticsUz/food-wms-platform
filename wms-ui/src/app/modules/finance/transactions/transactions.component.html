<div class="page-enter">
  <app-page-header title="Transactions" subtitle="Track income and expenses">
    <p-button icon="pi pi-plus" label="Add Transaction" (onClick)="openNew()" />
  </app-page-header>

  <!-- Filters -->
  <div class="filters-bar wms-card">
    <div class="filter-group">
      <p-select
        [options]="typeOptions"
        [ngModel]="typeFilter()"
        (ngModelChange)="typeFilter.set($event); onFilterChange()"
        optionLabel="label"
        optionValue="value"
        placeholder="Type"
        [style]="{ minWidth: '160px' }" />
    </div>
    <div class="filter-group">
      <p-datepicker
        [ngModel]="dateFrom()"
        (ngModelChange)="dateFrom.set($event); onFilterChange()"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        placeholder="From" />
    </div>
    <div class="filter-group">
      <p-datepicker
        [ngModel]="dateTo()"
        (ngModelChange)="dateTo.set($event); onFilterChange()"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        placeholder="To" />
    </div>
  </div>

  <!-- Transactions Table -->
  <div class="wms-card table-wrapper">
    <p-table
      [value]="transactions()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="15"
      [rowsPerPageOptions]="[10, 15, 25, 50]"
      [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th>Type</th>
          <th class="text-right" pSortableColumn="amount">Amount <p-sortIcon field="amount" /></th>
          <th>Counterparty</th>
          <th>Description</th>
          <th pSortableColumn="date">Date <p-sortIcon field="date" /></th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-t>
        <tr>
          <td>
            <app-status-badge [status]="getTypeStatus(t.type)" [label]="getTypeName(t.type)" />
          </td>
          <td class="text-right">
            <span class="number" [class.amount-income]="t.type === 1" [class.amount-expense]="t.type === 2">
              {{ t.amount | number:'1.0-2' }}
            </span>
          </td>
          <td>{{ t.counterpartyName || '—' }}</td>
          <td>{{ t.description || '—' }}</td>
          <td>{{ t.date | date:'MMM d, yyyy' }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="deleteTransaction(t)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="6">
            <div class="empty-state">
              <i class="pi pi-wallet"></i>
              <p>No transactions found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Transaction Form Dialog -->
<p-dialog
  header="New Transaction"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '480px' }"
  [draggable]="false">
  <div class="form-grid">
    <div class="form-field">
      <label>Type *</label>
      <p-select
        [options]="typeOptions.slice(1)"
        [ngModel]="form().type"
        (ngModelChange)="updateForm('type', $event)"
        optionLabel="label"
        optionValue="value"
        [style]="{ width: '100%' }" />
    </div>

    <div class="form-field">
      <label>Amount *</label>
      <p-inputNumber
        [ngModel]="form().amount"
        (ngModelChange)="updateForm('amount', $event)"
        [minFractionDigits]="0"
        [maxFractionDigits]="2"
        mode="decimal"
        [style]="{ width: '100%' }" />
    </div>

    <div class="form-field">
      <label>Counterparty</label>
      <p-select
        [options]="counterparties()"
        [ngModel]="form().counterpartyId"
        (ngModelChange)="updateForm('counterpartyId', $event)"
        optionLabel="name"
        optionValue="id"
        placeholder="Select counterparty"
        [showClear]="true"
        [style]="{ width: '100%' }" />
    </div>

    <div class="form-field">
      <label>Date *</label>
      <p-datepicker
        [ngModel]="formDate()"
        (ngModelChange)="formDate.set($event)"
        dateFormat="yy-mm-dd"
        [showIcon]="true"
        [style]="{ width: '100%' }" />
    </div>

    <div class="form-field full-width">
      <label>Description</label>
      <textarea pTextarea
        [ngModel]="form().description ?? ''"
        (ngModelChange)="updateForm('description', $event || null)"
        rows="3"
        class="w-full"
        placeholder="Optional description..."></textarea>
    </div>
  </div>

  <ng-template #footer>
    <p-button label="Cancel" [text]="true" (onClick)="dialogVisible.set(false)" />
    <p-button label="Create" icon="pi pi-check" (onClick)="save()" [loading]="saving()" />
  </ng-template>
</p-dialog>
