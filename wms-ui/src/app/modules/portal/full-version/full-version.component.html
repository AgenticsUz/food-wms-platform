<div class="page-enter full-version" *transloco="let t">
  <h1 class="page-title">{{ t('upgrade.pageTitle') }}</h1>
  <p class="page-lead">{{ t('upgrade.pageLead') }}</p>

  <div class="feature-grid">
    @for (item of items; track item.key) {
      <div class="wms-card feature-card">
        <div class="feature-icon"><i [class]="item.icon"></i></div>
        <div class="feature-name">{{ t('nav.' + item.key) }}</div>
        <div class="feature-desc">{{ t('upgrade.item.' + item.key) }}</div>
      </div>
    }
  </div>

  <div class="wms-card cta-card">
    <div>
      <div class="cta-title">{{ t('upgrade.ctaTitle') }}</div>
      <div class="cta-text">{{ t('upgrade.ctaText') }}</div>
    </div>
    <a class="cta-back" routerLink="/portal/dashboard">{{ t('common.back') }}</a>
  </div>
</div>
