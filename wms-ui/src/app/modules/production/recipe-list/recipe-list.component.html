<div class="page-enter">
  <app-page-header title="Production Recipes" subtitle="Manage recipes for finished products">
    <p-button icon="pi pi-plus" label="New Recipe" (onClick)="createNew()" />
  </app-page-header>

  <!-- Search -->
  <div class="filters-bar wms-card">
    <div class="filter-group">
      <span class="p-input-icon-left">
        <i class="pi pi-search"></i>
        <input pInputText
               placeholder="Search recipes..."
               [ngModel]="search()"
               (ngModelChange)="onSearchChange($event)" />
      </span>
    </div>
  </div>

  <!-- Recipes Table -->
  <div class="wms-card table-wrapper">
    <p-table [value]="filtered()" [loading]="loading()" [paginator]="true" [rows]="15"
      [rowsPerPageOptions]="[10, 15, 25, 50]" [scrollable]="true"
      styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th pSortableColumn="name">Name <p-sortIcon field="name" /></th>
          <th>Output Product</th>
          <th class="text-right">Output Qty</th>
          <th>Unit</th>
          <th class="text-center">Status</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-recipe>
        <tr>
          <td><span class="item-name">{{ recipe.name }}</span></td>
          <td>{{ recipe.outputProductName || '—' }}</td>
          <td class="text-right"><span class="number">{{ recipe.outputQuantity | number:'1.0-2' }}</span></td>
          <td>{{ recipe.outputUnitName || '—' }}</td>
          <td class="text-center">
            <app-status-badge
              [status]="recipe.isActive ? 'Confirmed' : 'Cancelled'"
              [label]="recipe.isActive ? 'Active' : 'Inactive'" />
          </td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-eye" [rounded]="true" [text]="true" severity="info"
              (onClick)="viewRecipe(recipe)" />
            <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger"
              (onClick)="deleteRecipe(recipe)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="6">
            <div class="empty-state">
              <i class="pi pi-book"></i>
              <p>No recipes found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
