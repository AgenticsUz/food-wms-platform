<div class="page-enter">
  <app-page-header title="New Recipe" subtitle="Build a production recipe with stages and inputs">
    <p-button icon="pi pi-arrow-left" label="Back" [text]="true" (onClick)="goBack()" />
  </app-page-header>

  <!-- Recipe Info -->
  <div class="wms-card section-card">
    <h3 class="section-title">Recipe Information</h3>
    <div class="form-grid">
      <div class="form-field">
        <label>Recipe Name *</label>
        <input pInputText [ngModel]="recipeName()" (ngModelChange)="recipeName.set($event)" placeholder="e.g. Plombir 100ml Recipe" class="w-full" />
      </div>
      <div class="form-field">
        <label>Output Product *</label>
        <p-select [options]="products()" [ngModel]="outputProductId()" (ngModelChange)="outputProductId.set($event)"
          optionLabel="name" optionValue="id" placeholder="Select finished product" [filter]="true" [style]="{ width: '100%' }" />
      </div>
      <div class="form-field">
        <label>Output Quantity *</label>
        <p-inputNumber [ngModel]="outputQuantity()" (ngModelChange)="outputQuantity.set($event ?? 0)"
          placeholder="Quantity" [minFractionDigits]="0" [maxFractionDigits]="2" [style]="{ width: '100%' }" />
      </div>
      <div class="form-field">
        <label>Output Unit *</label>
        <p-select [options]="units()" [ngModel]="outputUnitId()" (ngModelChange)="outputUnitId.set($event)"
          optionLabel="name" optionValue="id" placeholder="Select unit" [style]="{ width: '100%' }" />
      </div>
      <div class="form-field">
        <label>Active</label>
        <p-toggleSwitch [ngModel]="isActive()" (ngModelChange)="isActive.set($event)" />
      </div>
    </div>
  </div>

  <!-- Stages -->
  @for (stage of stages(); track $index; let i = $index) {
    <div class="wms-card section-card stage-card">
      <div class="stage-header">
        <h3 class="section-title">Stage {{ i + 1 }}</h3>
        <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" (onClick)="removeStage(i)" />
      </div>

      <div class="form-grid">
        <div class="form-field">
          <label>Production Stage *</label>
          <p-select [options]="availableStages()" [ngModel]="stage.stageId" (ngModelChange)="stage.stageId = $event"
            optionLabel="name" optionValue="id" placeholder="Select stage" [style]="{ width: '100%' }" />
        </div>
        <div class="form-field">
          <label>Order Number</label>
          <p-inputNumber [ngModel]="stage.orderNumber" (ngModelChange)="stage.orderNumber = $event ?? (i + 1)"
            [min]="1" [style]="{ width: '100%' }" />
        </div>
        <div class="form-field">
          <label>Expected Output Qty</label>
          <p-inputNumber [ngModel]="stage.expectedOutputQty" (ngModelChange)="stage.expectedOutputQty = $event"
            [minFractionDigits]="0" [maxFractionDigits]="2" placeholder="Optional" [style]="{ width: '100%' }" />
        </div>
        <div class="form-field">
          <label>Output Product (Semi-finished)</label>
          <p-select [options]="products()" [ngModel]="stage.outputProductId" (ngModelChange)="stage.outputProductId = $event"
            optionLabel="name" optionValue="id" placeholder="Optional" [filter]="true" [showClear]="true" [style]="{ width: '100%' }" />
        </div>
        <div class="form-field">
          <label>Allow Warehouse Output</label>
          <p-toggleSwitch [ngModel]="stage.allowWarehouseOutput" (ngModelChange)="stage.allowWarehouseOutput = $event" />
        </div>
        @if (stage.allowWarehouseOutput) {
          <div class="form-field">
            <label>Output Warehouse</label>
            <p-select [options]="warehouses()" [ngModel]="stage.outputWarehouseId" (ngModelChange)="stage.outputWarehouseId = $event"
              optionLabel="name" optionValue="id" placeholder="Select warehouse" [style]="{ width: '100%' }" />
          </div>
        }
      </div>

      <!-- Stage Inputs -->
      <h4 class="inputs-title">Inputs</h4>
      @for (input of stage.inputs; track $index; let j = $index) {
        <div class="input-row">
          <div class="input-field">
            <p-select [options]="products()" [ngModel]="input.productId" (ngModelChange)="input.productId = $event"
              optionLabel="name" optionValue="id" placeholder="Select product" [filter]="true" [style]="{ width: '100%' }" />
          </div>
          <div class="input-field small">
            <p-inputNumber [ngModel]="input.quantity" (ngModelChange)="input.quantity = $event ?? 0"
              placeholder="Qty" [minFractionDigits]="0" [maxFractionDigits]="2" [style]="{ width: '100%' }" />
          </div>
          <div class="input-field small">
            <p-select [options]="units()" [ngModel]="input.unitId" (ngModelChange)="input.unitId = $event"
              optionLabel="name" optionValue="id" placeholder="Unit" [style]="{ width: '100%' }" />
          </div>
          <p-button icon="pi pi-times" [rounded]="true" [text]="true" severity="danger" (onClick)="removeInput(i, j)" />
        </div>
      }

      @if (stage.inputs.length === 0) {
        <div class="empty-state small">
          <p>No inputs added for this stage</p>
        </div>
      }

      <p-button icon="pi pi-plus" label="Add Input" [text]="true" severity="secondary" (onClick)="addInput(i)" />
    </div>
  }

  <!-- Add Stage Button -->
  <div class="add-stage-btn">
    <p-button icon="pi pi-plus" label="Add Stage" [outlined]="true" (onClick)="addStage()" [style]="{ width: '100%' }" />
  </div>

  <!-- Action Bar -->
  <div class="action-bar">
    <p-button label="Cancel" [text]="true" severity="secondary" (onClick)="goBack()" />
    <p-button label="Create Recipe" icon="pi pi-check" (onClick)="submit()" [loading]="saving()" [disabled]="stages().length === 0" />
  </div>
</div>
