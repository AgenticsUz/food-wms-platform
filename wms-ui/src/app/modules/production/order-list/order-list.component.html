<div class="page-enter">
  <app-page-header title="Production Orders" subtitle="Manage and track production orders">
    <p-button icon="pi pi-plus" label="New Order" (onClick)="createNew()" />
  </app-page-header>

  <div class="filters-bar wms-card">
    <div class="filter-group">
      <p-select [options]="statusOptions" [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event); onFilterChange()"
        optionLabel="label" optionValue="value" placeholder="Status" [style]="{ minWidth: '180px' }" />
    </div>
  </div>

  <div class="wms-card table-wrapper">
    <p-table [value]="orders()" [loading]="loading()" [paginator]="true" [rows]="15"
      [rowsPerPageOptions]="[10, 15, 25, 50]" [scrollable]="true" styleClass="p-datatable-sm p-datatable-striped">
      <ng-template #header>
        <tr>
          <th>ID</th>
          <th>Recipe</th>
          <th>Product</th>
          <th class="text-right">Planned Qty</th>
          <th>Status</th>
          <th pSortableColumn="plannedStartDate">Start Date <p-sortIcon field="plannedStartDate" /></th>
          <th>Assigned To</th>
          <th class="text-center">Actions</th>
        </tr>
      </ng-template>
      <ng-template #body let-order>
        <tr>
          <td><span class="number">#{{ order.id }}</span></td>
          <td><span class="item-name">{{ order.recipeName }}</span></td>
          <td>{{ order.outputProductName }}</td>
          <td class="text-right"><span class="number">{{ order.plannedQuantity | number:'1.0-2' }}</span></td>
          <td>
            <app-status-badge [status]="getStatusKey(order.status)" [label]="getStatusName(order.status)" />
          </td>
          <td>{{ order.plannedStartDate | date:'MMM d, yyyy' }}</td>
          <td>{{ order.assignedToUserName || '—' }}</td>
          <td class="text-center actions-cell">
            <p-button icon="pi pi-eye" [rounded]="true" [text]="true" severity="secondary" (onClick)="viewDetail(order)" />
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="8">
            <div class="empty-state">
              <i class="pi pi-cog"></i>
              <p>No production orders found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
