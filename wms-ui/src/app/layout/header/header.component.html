<header class="app-header">
  <div class="header-left">
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <i class="pi pi-bars"></i>
    </button>
    <h2 class="page-title">WMS Platform</h2>
  </div>

  <div class="header-right">
    <!-- Language Switcher -->
    <div class="lang-switcher">
      <button class="lang-btn"
              [class.active]="(currentLang | async) === 'uz'"
              (click)="switchLang('uz')">UZ</button>
      <button class="lang-btn"
              [class.active]="(currentLang | async) === 'uz-cyrl'"
              (click)="switchLang('uz-cyrl')">УЗ</button>
      <button class="lang-btn"
              [class.active]="(currentLang | async) === 'ru'"
              (click)="switchLang('ru')">RU</button>
      <button class="lang-btn"
              [class.active]="(currentLang | async) === 'en'"
              (click)="switchLang('en')">EN</button>
    </div>

    <!-- Currency Rates -->
    <div class="currency-widget">
      @if (currencyService.loading()) {
        <span class="currency-loading">...</span>
      } @else {
        @for (entry of mainRates(); track entry.code; let last = $last) {
          <span class="currency-entry">
            <span class="currency-code">{{ entry.code }}</span>
            <span class="currency-rate">{{ entry.rate | number:'1.0-0' }}</span>
          </span>
          @if (!last) {
            <span class="currency-sep">|</span>
          }
        }
        <button class="currency-refresh" (click)="currencyService.loadRates()" title="Refresh">
          <i class="pi pi-refresh"></i>
        </button>
      }
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" (click)="toggleTheme()">
      <i class="pi" [class.pi-moon]="!themeService.isDark()" [class.pi-sun]="themeService.isDark()"></i>
    </button>

    <!-- Notifications -->
    <app-notification-bell />

    <!-- User -->
    <div class="user-badge">
      <div class="avatar">
        <i class="pi pi-user"></i>
      </div>
      <span class="user-name">{{ currentUser()?.fullName ?? 'User' }}</span>
    </div>
  </div>
</header>
