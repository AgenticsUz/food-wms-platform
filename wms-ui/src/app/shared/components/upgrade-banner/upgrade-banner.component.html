@if (visible()) {
  <div class="upgrade-banner" *transloco="let t">
    @if (submitted()) {
      <i class="pi pi-check-circle"></i>
      <div class="banner-body">
        <div class="banner-title">{{ t('upgrade.sentTitle') }}</div>
        <div class="banner-text">{{ t('upgrade.sentText') }}</div>
      </div>
    } @else {
      <i class="pi pi-warehouse"></i>
      <div class="banner-body">
        <div class="banner-title">{{ t('upgrade.title') }}</div>
        <div class="banner-text">
          {{ t('upgrade.text') }}
          <a routerLink="/portal/full-version">{{ t('upgrade.learnMore') }}</a>
        </div>
      </div>
      <p-button [label]="t('upgrade.interested')" size="small" (onClick)="open()" />
      <button class="banner-close" type="button" (click)="dismiss()" [attr.aria-label]="t('common.close')">
        <i class="pi pi-times"></i>
      </button>
    }
  </div>

  <p-dialog [visible]="dialogVisible()" (visibleChange)="dialogVisible.set($event)"
    [header]="'' + t('upgrade.title')" [modal]="true" [style]="{ width: '420px' }" [draggable]="false"
    *transloco="let t">
    <div class="upgrade-form">
      <div class="form-field">
        <label>{{ t('common.phone') }} *</label>
        <input pInputText [ngModel]="phone()" (ngModelChange)="phone.set($event)" class="w-full" />
      </div>
      <div class="form-field">
        <label>{{ t('common.note') }}</label>
        <textarea pTextarea [ngModel]="note()" (ngModelChange)="note.set($event)" rows="2" class="w-full"></textarea>
      </div>
    </div>
    <ng-template #footer>
      <p-button [label]="t('common.cancel')" [text]="true" (onClick)="dialogVisible.set(false)" />
      <p-button [label]="t('common.submit')" icon="pi pi-send" [loading]="saving()" (onClick)="submit()" />
    </ng-template>
  </p-dialog>
}
