# Host nginx — wms.agentics.uz → wms-web konteyneri (127.0.0.1:5510, PLATFORMA-TZ §6.1, D16).
# TLS: certbot (webroot). Domen ostida bitta SPA: / (wms-web).
# Alohida `location /admin/` YO'Q — hammasi `location /` orqali konteynerga o'tadi.
# `/admin/v1/*` (Console → WMS admin API'si, Console vhost'i `/api/wms/` ni kesib shu
# domenga `Host: wms.agentics.uz` bilan yuboradi) ham shu yo'l bilan o'tadi va uni
# konteyner nginx'i (`docker/nginx/wms.conf`) API'ga ajratadi.
# `/hubs/` YO'Q — WMS'da SignalR yo'q (Wash vhost'idan farqi).
# Xavfsizlik sarlavhalari shu yerda (edge) — konteyner nginx'i takrorlamaydi.

server {
    listen 80;
    listen [::]:80;
    server_name wms.agentics.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wms.agentics.uz;

    ssl_certificate     /etc/letsencrypt/live/wms.agentics.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wms.agentics.uz/privkey.pem;
    include /etc/nginx/snippets/agentics-wms-tls.conf;

    # Konteyner nginx'i bilan BIR XIL (20m) — Excel import va logo yuklash.
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:5510;
        include /etc/nginx/snippets/agentics-wms-proxy.conf;
    }
}
