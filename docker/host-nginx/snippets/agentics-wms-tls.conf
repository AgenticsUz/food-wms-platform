# TLS (Mozilla intermediate).
# Sessiya keshi zonasi nomi mahsulotniki (`WmsSSL`): bitta host nginx'da Wash va
# WMS vhost'lari yonma-yon turadi va umumiy nom bir repo'dagi o'lcham o'zgarishi
# boshqasini «zone is already declared with different size» bilan yiqitardi.
ssl_session_timeout 1d;
ssl_session_cache shared:WmsSSL:10m;
ssl_session_tickets off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_stapling on;
ssl_stapling_verify on;
