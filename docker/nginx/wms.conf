# =============================================================================
#  AGENTICS WMS — konteyner ichidagi nginx (web image)
#
#  Bitta originda bitta SPA + API proksi:
#     /            -> wms-web       (ombor ilovasi)
#     /admin/v1/   -> wms-api:8080  (Console yuzasi, PLATFORMA-TZ §4.4)
#     /api/        -> wms-api:8080
#     /uploads/    -> wms-api:8080  (tenant logolari, `wms-uploads` hajmi)
#
#  Wash'dan farqi: `/hubs/` YO'Q (WMS'da SignalR yo'q, §7·F6.1) va service worker
#  qoidalari YO'Q (PWA/offline yo'q, D1). Qoida ishlatilmasa ham qoldirilsa, u
#  mavjud bo'lmagan narsani «bor» deb ko'rsatadigan yolg'on hujjatga aylanardi.
#
#  Hostdagi (ya'ni domen darajasidagi) nginx alohida: docker/host-nginx/.
#  Bu yerdagi konfiguratsiya TLS bilan shug'ullanmaydi — u tashqarida uziladi.
# =============================================================================

upstream wms_api {
    server wms-api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hostdagi nginx bilan BIR XIL (20m). Bu yerda kattaroq qo'yilsa chegara
    # amalda baribir edge'da ushlanardi — ikkita raqam, bittasi yolg'on.
    # (Eng katta yuklamalar — Excel import va tenant logotipi.)
    client_max_body_size 20m;

    # Proksi ortida ishlaymiz: haqiqiy sxema/host hostdagi nginx'dan keladi.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host  $host;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml font/woff2;

    # --- salomatlik (konteyner HEALTHCHECK va host nginx uchun) ---------------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- Console yuzasi (PLATFORMA-TZ §4.4) -----------------------------------
    # Console (`admin.agentics.uz`) manzilni `/api/wms/admin/v1/...` deb yozadi, Console
    # vhost'i esa `/api/wms/` prefiksini `rewrite` bilan KESIB tashlaydi — bu yerga so'rov
    # `/admin/v1/...` bo'lib, wms.agentics.uz nomi ostida keladi. Chegara manzil bilan
    # emas, audience bilan qo'yilgan (`wms-admin-api`, `WmsSurfaces`).
    #
    # ⚠️ `^~` ATAYLAB: usiz nginx bu prefiksdan keyin REGEX location'larni ham ko'rib
    # chiqadi va pastdagi `~* \.(js|css|...)$` qoidasi `.json`/`.svg`/`.png` bilan
    # tugaydigan admin so'rovini `try_files` ga burib yuborardi → 404.
    location ^~ /admin/v1/ {
        proxy_pass http://wms_api;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # --- API va fayllar -------------------------------------------------------
    # ⚠️ `^~` bu ikkisida ham SHART (Wash'da yo'q — u yerdagi yashirin nosozlik):
    # logo manzili `/uploads/tenants/<id>/logo.png` va u regex statik qoidaga mos
    # keladi; `^~` siz nginx faylni API'dan emas, SPA papkasidan izlar va 404
    # berardi. `/api/` da ham shu xavf (`.../export.pdf`, `.png` bilan tugaydigan yo'l).
    location ^~ /api/ {
        proxy_pass http://wms_api;
        # Eksport/uzoq hisobotlar buferlanmasin.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location ^~ /uploads/ {
        proxy_pass http://wms_api;
        proxy_read_timeout 120s;
    }

    # --- runtime konfiguratsiya ----------------------------------------------
    # HECH QACHON keshlanmaydi: stend manzillari shu fayl orqali almashadi va
    # eski nusxa qolib ketsa ilova noto'g'ri Identity'ga boradi.
    location = /assets/config/app-config.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # --- statik hash'langan resurslar ----------------------------------------
    # Angular fayl nomiga hash qo'yadi, shuning uchun immutable xavfsiz.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # --- ombor SPA'si ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html hech qachon keshlanmasin — yangi deploy darhol ko'rinsin.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
}
